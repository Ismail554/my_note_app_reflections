name: Reflections
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^3.3.3
  flutter_screenutil: ^5.9.3
  go_router: ^17.2.1
  intl: ^0.20.2
  change_app_package_name: ^1.5.0
  firebase_core: ^4.7.0
  flutter_dotenv: ^6.0.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  flutter_launcher_icons: ^0.14.4
  provider: ^6.1.5+1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  firebase_messaging: ^16.2.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  path: ^1.9.1
  fl_chart: ^1.2.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  file_picker: ^8.1.4
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21 


flutter:

 
  uses-material-design: true
 
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/svgs/
    - assets/sounds/
    - .env

